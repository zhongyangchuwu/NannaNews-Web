name: Check and publish PDF reader

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_pr:
        description: 'Upload PR number for non-default-branch testing'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nannanews-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.upload_pr == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_data: ${{ steps.inputs.outputs.has_data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native PDF text reader
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci --ignore-scripts
      - run: python -m pip install '.[test]'
      - name: Check tracked input boundary
        run: node scripts/check-input-boundary.mjs
      - name: Validate reviewed master and public sources
        id: inputs
        run: node --experimental-strip-types scripts/published-inputs.mjs
      - run: npm test
      - run: python -m pytest -q
      - name: Check static bundling with synthetic data only
        run: node tests/prepare-build.mjs && npm run build
      # No artifact from this job is ever deployed. Real local inputs are absent.

  upload-test:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.upload_pr != '' &&
      github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: read
      checks: write
    uses: ./.github/workflows/pdf-upload.yml
    with:
      pr_number: ${{ inputs.upload_pr }}
      base_ref: ${{ github.ref_name }}

  content:
    needs: check
    if: needs.check.outputs.has_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Stage reviewed canonical master read-only
        run: npm run stage:data -- data/catalog.json
      - name: Validate and build publication
        run: npm run build
      - name: Package real publication only
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: content
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
